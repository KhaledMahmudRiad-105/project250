
<!DOCTYPE html>
<html>
<head>
    <title>Subject Management | Project250</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        input {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .delete {
            background: #dc2626;
        }

        .message {
            color: green;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Subject Management</h1>
        <p>Manage school subjects here.</p>

        <a href="/">Back to Dashboard</a>

        {{if .Message}}
        <p class="message">{{.Message}}</p>
        {{end}}

        <h2>Add New Subject</h2>

        <form method="POST" action="/subjects">
            <input type="text" name="name"
                placeholder="Subject name" maxlength="100" required>
            <button type="submit">Add Subject</button>
        </form>

        <h2>Subject List</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Subject Name</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {{range .Subjects}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Name}}</td>
                    <td>
                        <a href="/subjects/edit?id={{.ID}}">Edit</a>

                        <form method="POST" action="/subjects/delete"
                            style="display:inline;"
                            onsubmit="return confirm('Are you sure you want to delete this subject?');">
                            <input type="hidden" name="id" value="{{.ID}}">
                            <button type="submit" class="delete">Delete</button>
                        </form>
                    </td>
                </tr>
                {{else}}
                <tr>
                    <td colspan="3">No subjects added yet.</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</body>
</html>
